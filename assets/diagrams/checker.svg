<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="title desc"><title id="title">TypeScript source checking and guarded native compilation</title><desc id="desc">One authored parser feeds both source checking and executable lowering. Complete type contracts inform guarded native specialization. Diagnostics retain authored source locations; runtime guards preserve a generic fallback.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#b6462b"/></marker></defs><g fill="#faf8f3" stroke="#c9cbbf"><rect x="10" y="122" width="125" height="72" rx="4"/><rect x="173" y="122" width="126" height="72" rx="4"/><rect x="345" y="25" width="193" height="100" rx="4"/><rect x="345" y="200" width="193" height="95" rx="4"/><rect x="585" y="112" width="205" height="100" rx="4"/></g><g stroke="#b6462b" fill="none" stroke-width="2" marker-end="url(#arrow)"><path d="M135 158H167"/><path d="M299 148L336 76"/><path d="M299 174L336 242"/><path d="M538 76L578 145"/><path d="M538 244L578 177"/></g><g fill="#292d24" font-family="sans-serif" font-size="17" text-anchor="middle"><text x="72" y="150">Authored</text><text x="72" y="173">TypeScript</text><text x="236" y="150">One parser</text><text x="236" y="173">Source snapshot</text><text x="441" y="56">Source checker</text><text x="441" y="84" font-size="14">Diagnostics · type contracts</text><text x="441" y="106" font-size="12">Complete results only → hints</text><text x="441" y="232">Executable lowering</text><text x="441" y="261" font-size="14">JavaScript semantics</text><text x="687" y="143">Native specialization</text><text x="687" y="172" font-size="14">Runtime guard</text><text x="687" y="193" font-size="14">Generic fallback</text></g></svg>
