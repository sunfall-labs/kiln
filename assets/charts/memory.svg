<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 360 220" role="img" aria-labelledby="memory-svg-title memory-svg-desc">
<title id="memory-svg-title">Peak server resident memory</title>
<desc id="memory-svg-desc">Bars start at zero. kiln native: 26–33 MB; Bun: 63–65 MB; Node: 87 MB; Deno: 153–155 MB. Exact values are also available in the result table.</desc>
<defs><pattern id="memory-range" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="4" fill="#ffffff" fill-opacity=".5"/></pattern></defs>
<g class="chart-row" data-series="kiln"><text class="chart-label" x="0" y="32" fill="#b6462b" font-family="sans-serif" font-size="12">kiln native</text><rect x="87" y="17" width="172" height="22" fill="#ebece3"/><rect class="bar" x="87" y="17" width="35.4750" height="22" fill="#b6462b"/><rect x="114.9500" y="17" width="7.5250" height="22" fill="url(#memory-range)"/><text class="chart-value" x="357" y="32" text-anchor="end" fill="#b6462b" font-family="monospace" font-size="12">26–33 MB</text></g>
<g class="chart-row" data-series="bun"><text class="chart-label" x="0" y="77" fill="#73796b" font-family="sans-serif" font-size="12">Bun</text><rect x="87" y="62" width="172" height="22" fill="#ebece3"/><rect class="bar" x="87" y="62" width="69.8750" height="22" fill="#73796b"/><rect x="154.7250" y="62" width="2.1500" height="22" fill="url(#memory-range)"/><text class="chart-value" x="357" y="77" text-anchor="end" fill="#73796b" font-family="monospace" font-size="12">63–65 MB</text></g>
<g class="chart-row" data-series="node"><text class="chart-label" x="0" y="122" fill="#73796b" font-family="sans-serif" font-size="12">Node</text><rect x="87" y="107" width="172" height="22" fill="#ebece3"/><rect class="bar" x="87" y="107" width="93.5250" height="22" fill="#73796b"/><rect x="180.5250" y="107" width="0.0000" height="22" fill="url(#memory-range)"/><text class="chart-value" x="357" y="122" text-anchor="end" fill="#73796b" font-family="monospace" font-size="12">87 MB</text></g>
<g class="chart-row" data-series="deno"><text class="chart-label" x="0" y="167" fill="#73796b" font-family="sans-serif" font-size="12">Deno</text><rect x="87" y="152" width="172" height="22" fill="#ebece3"/><rect class="bar" x="87" y="152" width="166.6250" height="22" fill="#73796b"/><rect x="251.4750" y="152" width="2.1500" height="22" fill="url(#memory-range)"/><text class="chart-value" x="357" y="167" text-anchor="end" fill="#73796b" font-family="monospace" font-size="12">153–155 MB</text></g>
<path d="M87 12V184H259" fill="none" stroke="#a9ad9f" stroke-width="1"/>
<text x="87" y="204" fill="#6c7066" font-family="monospace" font-size="10">0</text>
<text x="259" y="204" text-anchor="end" fill="#6c7066" font-family="monospace" font-size="10">160 MB</text>
</svg>
