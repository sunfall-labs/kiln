<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 360 220" role="img" aria-labelledby="scaling-svg-title scaling-svg-desc">
<title id="scaling-svg-title">Small-service worker scaling</title>
<desc id="scaling-svg-desc">Bars start at zero. 1 worker: 20k; 2 workers: 35.7k; 4 workers: 53.3k; auto (16): 60.3k. Exact values are also available in the result table.</desc>
<defs><pattern id="scaling-range" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="4" fill="#ffffff" fill-opacity=".5"/></pattern></defs>
<g class="chart-row" data-series="1 worker"><text class="chart-label" x="0" y="32" fill="#73796b" font-family="sans-serif" font-size="12">1 worker</text><rect x="87" y="17" width="172" height="22" fill="#ebece3"/><rect class="bar" x="87" y="17" width="34.4000" height="22" fill="#73796b"/><text class="chart-value" x="357" y="32" text-anchor="end" fill="#73796b" font-family="monospace" font-size="12">20k</text></g>
<g class="chart-row" data-series="2 workers"><text class="chart-label" x="0" y="77" fill="#73796b" font-family="sans-serif" font-size="12">2 workers</text><rect x="87" y="62" width="172" height="22" fill="#ebece3"/><rect class="bar" x="87" y="62" width="61.4040" height="22" fill="#73796b"/><text class="chart-value" x="357" y="77" text-anchor="end" fill="#73796b" font-family="monospace" font-size="12">35.7k</text></g>
<g class="chart-row" data-series="4 workers"><text class="chart-label" x="0" y="122" fill="#73796b" font-family="sans-serif" font-size="12">4 workers</text><rect x="87" y="107" width="172" height="22" fill="#ebece3"/><rect class="bar" x="87" y="107" width="91.6760" height="22" fill="#73796b"/><text class="chart-value" x="357" y="122" text-anchor="end" fill="#73796b" font-family="monospace" font-size="12">53.3k</text></g>
<g class="chart-row" data-series="auto (16)"><text class="chart-label" x="0" y="167" fill="#73796b" font-family="sans-serif" font-size="12">auto (16)</text><rect x="87" y="152" width="172" height="22" fill="#ebece3"/><rect class="bar" x="87" y="152" width="103.7160" height="22" fill="#73796b"/><text class="chart-value" x="357" y="167" text-anchor="end" fill="#73796b" font-family="monospace" font-size="12">60.3k</text></g>
<path d="M87 12V184H259" fill="none" stroke="#a9ad9f" stroke-width="1"/>
<text x="87" y="204" fill="#6c7066" font-family="monospace" font-size="10">0</text>
<text x="259" y="204" text-anchor="end" fill="#6c7066" font-family="monospace" font-size="10">100k</text>
</svg>
