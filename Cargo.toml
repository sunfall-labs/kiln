[workspace]
resolver = "3"
members = ["crates/*", "bench"]
# `fuzz` carries its own lockfile and its own dependency tree (libfuzzer, bolero). Excluding it
# keeps that tree off every ordinary `cargo check --workspace`, which is the compiler developer's
# loop (docs/design.md §12, ADR 0004).
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sunfall-labs/kiln"

[workspace.dependencies]
kiln-artifact-cache = { path = "crates/kiln-artifact-cache" }
kiln-backend-c = { path = "crates/kiln-backend-c" }
kiln-builtin-surface = { path = "crates/kiln-builtin-surface" }
kiln-data-formats = { path = "crates/kiln-data-formats" }
kiln-db = { path = "crates/kiln-db" }
kiln-digest = { path = "crates/kiln-digest" }
kiln-hir = { path = "crates/kiln-hir" }
kiln-host-abi = { path = "crates/kiln-host-abi" }
kiln-ir = { path = "crates/kiln-ir" }
kiln-interpreter = { path = "crates/kiln-interpreter" }
kiln-module-graph = { path = "crates/kiln-module-graph" }
kiln-module-resolver = { path = "crates/kiln-module-resolver" }
kiln-native = { path = "crates/kiln-native" }
kiln-native-number = { path = "crates/kiln-native-number" }
kiln-native-number-abi = { path = "crates/kiln-native-number-abi" }
kiln-native-number-ffi = { path = "crates/kiln-native-number-ffi" }
kiln-native-runtime = { path = "crates/kiln-native-runtime" }
kiln-number-core = { path = "crates/kiln-number-core" }
kiln-runtime = { path = "crates/kiln-runtime" }
kiln-temporal = { path = "crates/kiln-temporal" }
kiln-json = { path = "crates/kiln-json" }
kiln-intl = { path = "crates/kiln-intl" }
kiln-native-toolchain = { path = "crates/kiln-native-toolchain" }
kiln-node-abi = { path = "crates/kiln-node-abi" }
kiln-node-path = { path = "crates/kiln-node-path" }
kiln-conformance = { path = "crates/kiln-conformance" }
kiln-proto = { path = "crates/kiln-proto" }
kiln-daemon = { path = "crates/kiln-daemon" }
kiln-test-selector = { path = "crates/kiln-test-selector" }
kiln-test262 = { path = "crates/kiln-test262" }
frontend-oxc = { path = "crates/frontend-oxc" }
libc = { version = "0.2", default-features = false }
libffi = { version = "5.2", default-features = false }
oxc_allocator = { version = "0.147.0", default-features = false }
oxc_ast = { version = "0.147.0", default-features = false }
oxc_parser = { version = "0.147.0", default-features = false }
oxc_resolver = { version = "11.24.3", default-features = false }
oxc_span = { version = "0.147.0", default-features = false }
oxc_syntax = { version = "0.147.0", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
dragonbox_ecma = { version = "0.1.12", default-features = false, features = ["ecma"] }
# The regexp engine. `regress` targets ECMAScript semantics specifically -- backreferences,
# lookaround, sticky matching -- which `regex` deliberately does not have, and it matches over
# UTF-16 so indices and `lastIndex` come out in the units the language counts in.
regress = { version = "0.12", default-features = false, features = ["backend-pikevm", "std", "utf16"] }
# The calendar and date/time engine behind `Temporal`. Pinned to the version the ECMAScript
# proposal's own test suite is tracked against upstream, because a calendar is not a page of code
# and two implementations would disagree in the corners rather than the middle (ADR 0025, 0029).
# `default` is off on purpose: it turns on `sys-local`, which reads the *host* clock and the
# *host* zone, and this realm's clock is virtual and its zone is UTC (ADR 0015). `compiled_data`
# brings the IANA zone database in so a program that names a zone explicitly gets a real answer;
# nothing here ever asks the host which zone it is in.
temporal_rs = { version = "0.2.6", default-features = false, features = ["std", "compiled_data"] }
# The internationalization engine behind `Intl`, linked rather than rewritten for the reason
# ADR 0025 gives for `regress` and ADR 0029 §4 names ICU4X for: locale negotiation, collation and
# number spellout are CLDR-shaped, and a second implementation would agree on `en-US` and disagree
# somewhere in the Serbian plural rules or the Thai grapheme boundaries -- a wrong *answer* rather
# than a refusal. ICU4X is component-per-crate on purpose; `icu` (the omnibus) is deliberately not
# used, because it would pull segmentation and calendar data into every build that only wanted to
# canonicalize a language tag (ADR 0029 adoption rule 3, ADR 0004's rebuild budget).
#
# `compiled_data` bakes the CLDR bundle in as a static rather than loading it at runtime: the data
# a formatter answers from is then fixed at build time, which is what lets it participate in the
# shipped runtime identity (ADR 0029 adoption rule 4) instead of varying with the host's ICU.
#
# `icu_locale_core` carries no data at all -- it is the BCP-47 grammar -- so it stays separate from
# `icu_locale`, which is the CLDR alias and likely-subtags tables that canonicalization needs.
icu_locale_core = { version = "2.3", default-features = false, features = ["alloc"] }
icu_locale = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_decimal = { version = "2.3", default-features = false, features = ["compiled_data", "alloc"] }
# `unstable` here is not a nightly switch either: it gates `PluralRulesWithRanges`, the CLDR
# plural *range* table `Intl.PluralRules.prototype.selectRange` answers from. A range's category is
# not a function of its two ends -- Russian sorts `0-2` into `few` although neither end is -- so
# without the table the method would have to guess.
icu_plurals = { version = "2.3", default-features = false, features = ["compiled_data", "unstable"] }
icu_list = { version = "2.3", default-features = false, features = ["compiled_data", "alloc"] }
icu_collator = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data", "auto"] }
# `Intl.DateTimeFormat`. This is the one formatter whose data is a *pattern* rather than a table:
# which fields a locale shows, in what order, with which separators and in which calendar is CLDR
# skeleton data, and `formatRange`'s "Jan 1 - 5, 2020" is a second table of interval patterns
# again. `unstable` is not a "nightly" switch -- it is what gates `icu_datetime::range`, the
# interval formatter. Without it `formatRange` would have to concatenate two formatted dates,
# which is a wrong answer in every locale that has an interval pattern, so the feature is required
# rather than speculative (ADR 0029 adoption rule 3). `default-features = false` drops `ixdtf`,
# the RFC 9557 string parser, which the adapter never reaches: instants arrive as a Number.
icu_datetime = { version = "2.3", default-features = false, features = ["compiled_data", "unstable"] }
# The IANA identifier table `timeZone` is validated and case-normalized against, the zone-offset
# periods behind it, and the `DateTime`/`ZonedDateTime` input types `icu_datetime` formats. ICU4X
# ships identifiers and offset *periods*, not a transition database, which is why the adapter can
# render a fixed-offset zone and refuses a daylight-observing one rather than guessing -- ADR 0015
# would rather have an implausible answer than a plausible wrong one.
icu_time = { version = "2.3", default-features = false, features = ["compiled_data", "alloc"] }
# The calendar systems `Intl.DateTimeFormat`'s `calendar` option selects between. `Date`'s own
# arithmetic stays proleptic Gregorian in the interpreter; this is only the formatter's.
icu_calendar = { version = "2.3", default-features = false, features = ["compiled_data"] }
# `Intl.RelativeTimeFormat` and `Intl.DisplayNames`. ICU4X keeps these in one pre-1.0 crate rather
# than promoting them individually; the data behind them (the "3 days ago" plural-selected
# patterns, the language/region/script name tables) is CLDR-shaped in exactly the way the rest of
# this list is, and hand-transcribing either would be the wrong-answer failure mode again. The
# version is pinned to a patch line because a 0.x minor is a breaking change here.
icu_experimental = { version = "0.6", default-features = false, features = ["compiled_data"] }
# The decimal type ICU4X's formatter takes, named directly because ECMAScript's own rounding is
# implemented over it: `fixed_decimal`'s five unsigned and four signed rounding modes are exactly
# ECMA-402's nine, and its rounding increments are exactly the {1,2,5,25}x10^k the language allows.
# `icu_decimal` re-exports the type but not the modes.
fixed_decimal = { version = "0.7", default-features = false }
# ICU4X's formatted output is a `Writeable` that annotates its own runs -- integer, group, decimal,
# fraction, sign -- which is what `formatToParts` has to report. Splitting the finished string back
# up by searching for separators would be the guess; reading the annotations is not.
writeable = { version = "0.6", default-features = false, features = ["alloc"] }
# Arbitrary-precision integers for `BigInt`. The type is arbitrary-precision by definition, so a
# fixed-width stand-in would be wrong for exactly the programs that reach for it.
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
num-traits = { version = "0.2", default-features = false, features = ["std"] }

# Declared centrally so no crate-level change has to edit this file. NOTE: these were dropped
# once by a concurrent rewrite of this section; if a build fails with "was not found in
# workspace.dependencies", check here first.
#
# proptest is used only as a dev-dependency, so it never enters a consumer's build graph and
# does not bear on the foundational-crate rule in docs/adr/0004.
proptest = { version = "1.11", default-features = false, features = ["std"] }
# Pure data-driven diagnostic snippet rendering for CLI reports. Zero procedural macros.
annotate-snippets = { version = "0.12", default-features = false, features = ["std"] }
# WHATWG Encoding Standard reference implementation in safe Rust (TextDecoder/Buffer).
encoding_rs = { version = "0.8", default-features = false, features = ["alloc"] }
# Filesystem events. The debouncer is not optional: editors write-then-rename and emit several
# events per save.
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-full = { version = "0.7", default-features = false }
# FxHashMap, for process-local tables where SipHash's DoS resistance and cross-release
# stability are both irrelevant. Never for a hash that is persisted or sent on the wire.
rustc-hash = { version = "2.1", default-features = false, features = ["std"] }
# Fast modern synchronization primitives (1-byte mutex, no poison panics, fast uncontended locks)
parking_lot = { version = "0.12", default-features = false }
# SIMD-accelerated byte search routines (AVX2/SSE2/NEON) for string and source scanning
memchr = { version = "2.7", default-features = false, features = ["std"] }
# Inline small vector optimization avoiding heap allocations for small lists
smallvec = { version = "1.14", default-features = false, features = ["serde"] }
# High performance AES-NI hardware-accelerated hasher for internal tables
ahash = { version = "0.8", default-features = false, features = ["std"] }
# Snapshot assertions for the C backend's emitted translation units, a dev-dependency only.
# `colors` (its default) is dropped: the diff is read in CI logs and in a plain terminal, and
# pulling `console` into the workspace graph to tint it is not worth the edge.
insta = { version = "1.48", default-features = false }
# Work-stealing for independent compiler and native-build CPU work. JavaScript realm ordering stays
# in kiln's realm scheduler; Rayon never schedules observable language jobs (ADR 0029).
rayon = { version = "1.12", default-features = false }
# The one realm scheduler. `test-util` is required for deterministic paused-time execution;
# keep Tokio's surface minimal because its types never cross `kiln-runtime`'s public seam.
tokio = { version = "1.48", default-features = false, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time", "test-util"] }
# Keyed supervision for realm-owned async requests. `JoinMap` keeps RequestId cancellation and task
# failure observation in one place without leaking Tokio types through the HostOps seam.
tokio-util = { version = "0.7", default-features = false, features = ["join-map"] }
# Stable whole-runtime counters for developer diagnostics. Keep `tokio_unstable` and exporter
# integrations out of the shipped runtime; Kiln exposes a small owned snapshot instead.
tokio-metrics = { version = "0.5", default-features = false, features = ["rt"] }
# HTTP protocol state machines. Tokio remains the sole runtime; Hyper never crosses the runtime
# seam, and default features stay off so HTTP/2 and client pools arrive only with explicit work.
hyper = { version = "1.7", default-features = false, features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server-auto"] }
http-body-util = { version = "0.1", default-features = false }
bytes = { version = "1.10", default-features = false }
# RustCrypto owns the cryptographic primitives behind node:crypto. Kiln supplies only the
# JavaScript object/lifecycle adapter; algorithms remain maintained, reviewed ecosystem code.
digest = { version = "0.10", default-features = false, features = ["std"] }
md-5 = { version = "0.10", default-features = false, features = ["std"] }
sha1 = { version = "0.10", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }

[profile.release]
debug = 1

# The provider archive is link input to *every* shipped artifact, so it is the one place where
# paying build time for output size is clearly the right trade. Fat LTO across it and its
# dependencies -- tokio, hyper, the semantic cores -- takes a compiled server from 4.93 MiB to
# 3.74 MiB, a 24% cut in the number this project's whole pitch rests on. It buys no throughput:
# measured at 4,649 rps against 4,972 without, which is noise, because the server's cost is
# `kevent` syscalls and no amount of inlining removes a syscall.
#
# Kept off `release` itself so an ordinary `mbx build --release` of the CLI and daemon is not
# slowed for an artifact property that only the shipped output has.
[profile.provider]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = 0

# a leaf edit should not drag the workspace with it (see docs/adr/0004)
[profile.dev]
opt-level = 0
debug = 1
incremental = true

# Optimize external dependencies (parsers, regex, unicode, tokio) during dev & test
[profile.dev.package."*"]
opt-level = 2

# Optimize pure-Rust SHA-256 digest engine (only 440 lines, instant to compile, 50x faster hashing)
[profile.dev.package.kiln-digest]
opt-level = 3
