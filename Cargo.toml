[workspace]
resolver = "3"
members = ["crates/*", "bench"]
# `fuzz` carries its own lockfile and its own dependency tree (libfuzzer, bolero). Excluding it
# keeps that tree off every ordinary `cargo check --workspace`, which is the compiler developer's
# loop (docs/design.md §12, ADR 0004).
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sunfall-labs/kiln"

[workspace.dependencies]
kiln-artifact-cache = { path = "crates/kiln-artifact-cache" }
kiln-backend-c = { path = "crates/kiln-backend-c" }
kiln-db = { path = "crates/kiln-db" }
kiln-digest = { path = "crates/kiln-digest" }
kiln-hir = { path = "crates/kiln-hir" }
kiln-host-abi = { path = "crates/kiln-host-abi" }
kiln-ir = { path = "crates/kiln-ir" }
kiln-interpreter = { path = "crates/kiln-interpreter" }
kiln-module-graph = { path = "crates/kiln-module-graph" }
kiln-module-resolver = { path = "crates/kiln-module-resolver" }
kiln-native = { path = "crates/kiln-native" }
kiln-native-number = { path = "crates/kiln-native-number" }
kiln-native-number-ffi = { path = "crates/kiln-native-number-ffi" }
kiln-native-runtime = { path = "crates/kiln-native-runtime" }
kiln-number-core = { path = "crates/kiln-number-core" }
kiln-runtime = { path = "crates/kiln-runtime" }
kiln-native-toolchain = { path = "crates/kiln-native-toolchain" }
kiln-conformance = { path = "crates/kiln-conformance" }
kiln-proto = { path = "crates/kiln-proto" }
kiln-daemon = { path = "crates/kiln-daemon" }
kiln-test-selector = { path = "crates/kiln-test-selector" }
kiln-test262 = { path = "crates/kiln-test262" }
frontend-oxc = { path = "crates/frontend-oxc" }
libc = { version = "0.2", default-features = false }
oxc_allocator = { version = "0.147.0", default-features = false }
oxc_ast = { version = "0.147.0", default-features = false }
oxc_parser = { version = "0.147.0", default-features = false }
oxc_resolver = { version = "11.24.3", default-features = false }
oxc_span = { version = "0.147.0", default-features = false }
oxc_syntax = { version = "0.147.0", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
dragonbox_ecma = { version = "0.1.12", default-features = false, features = ["ecma"] }
# The regexp engine. `regress` targets ECMAScript semantics specifically -- backreferences,
# lookaround, sticky matching -- which `regex` deliberately does not have, and it matches over
# UTF-16 so indices and `lastIndex` come out in the units the language counts in.
regress = { version = "0.12", default-features = false, features = ["backend-pikevm", "std", "utf16"] }
# Arbitrary-precision integers for `BigInt`. The type is arbitrary-precision by definition, so a
# fixed-width stand-in would be wrong for exactly the programs that reach for it.
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
num-traits = { version = "0.2", default-features = false, features = ["std"] }

# Declared centrally so no crate-level change has to edit this file. NOTE: these were dropped
# once by a concurrent rewrite of this section; if a build fails with "was not found in
# workspace.dependencies", check here first.
#
# proptest is used only as a dev-dependency, so it never enters a consumer's build graph and
# does not bear on the foundational-crate rule in docs/adr/0004.
proptest = { version = "1.11", default-features = false, features = ["std"] }
# Filesystem events. The debouncer is not optional: editors write-then-rename and emit several
# events per save.
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-full = { version = "0.7", default-features = false }
# FxHashMap, for process-local tables where SipHash's DoS resistance and cross-release
# stability are both irrelevant. Never for a hash that is persisted or sent on the wire.
rustc-hash = { version = "2.1", default-features = false, features = ["std"] }
# Snapshot assertions for the C backend's emitted translation units, a dev-dependency only.
# `colors` (its default) is dropped: the diff is read in CI logs and in a plain terminal, and
# pulling `console` into the workspace graph to tint it is not worth the edge.
insta = { version = "1.48", default-features = false }
# Work-stealing for independent compiler and native-build CPU work. JavaScript realm ordering stays
# in kiln's realm scheduler; Rayon never schedules observable language jobs (ADR 0029).
rayon = { version = "1.12", default-features = false }
# The one realm scheduler. `test-util` is required for deterministic paused-time execution;
# keep Tokio's surface minimal because its types never cross `kiln-runtime`'s public seam.
tokio = { version = "1.48", default-features = false, features = ["rt", "time", "test-util"] }

[profile.release]
debug = 1

# a leaf edit should not drag the workspace with it (see docs/adr/0004)
[profile.dev]
opt-level = 0
debug = 1
incremental = true
