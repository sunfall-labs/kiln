[workspace]
resolver = "3"
members = ["crates/*", "bench"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sunfall-labs/kiln"

[workspace.dependencies]
kiln-artifact-cache = { path = "crates/kiln-artifact-cache" }
kiln-backend-c = { path = "crates/kiln-backend-c" }
kiln-db = { path = "crates/kiln-db" }
kiln-hir = { path = "crates/kiln-hir" }
kiln-host-abi = { path = "crates/kiln-host-abi" }
kiln-ir = { path = "crates/kiln-ir" }
kiln-interpreter = { path = "crates/kiln-interpreter" }
kiln-module-graph = { path = "crates/kiln-module-graph" }
kiln-module-resolver = { path = "crates/kiln-module-resolver" }
kiln-native = { path = "crates/kiln-native" }
kiln-native-runtime = { path = "crates/kiln-native-runtime" }
kiln-runtime = { path = "crates/kiln-runtime" }
kiln-native-toolchain = { path = "crates/kiln-native-toolchain" }
kiln-conformance = { path = "crates/kiln-conformance" }
kiln-proto = { path = "crates/kiln-proto" }
kiln-daemon = { path = "crates/kiln-daemon" }
kiln-test-selector = { path = "crates/kiln-test-selector" }
kiln-test262 = { path = "crates/kiln-test262" }
frontend-oxc = { path = "crates/frontend-oxc" }
oxc_allocator = { version = "0.147.0", default-features = false }
oxc_ast = { version = "0.147.0", default-features = false }
oxc_parser = { version = "0.147.0", default-features = false }
oxc_span = { version = "0.147.0", default-features = false }
oxc_syntax = { version = "0.147.0", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

# Declared centrally so no crate-level change has to edit this file. NOTE: these were dropped
# once by a concurrent rewrite of this section; if a build fails with "was not found in
# workspace.dependencies", check here first.
#
# proptest is used only as a dev-dependency, so it never enters a consumer's build graph and
# does not bear on the foundational-crate rule in docs/adr/0004.
proptest = { version = "1.11", default-features = false, features = ["std"] }
# Filesystem events. The debouncer is not optional: editors write-then-rename and emit several
# events per save.
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-full = { version = "0.7", default-features = false }
# FxHashMap, for process-local tables where SipHash's DoS resistance and cross-release
# stability are both irrelevant. Never for a hash that is persisted or sent on the wire.
rustc-hash = { version = "2.1", default-features = false, features = ["std"] }

[profile.release]
debug = 1

# a leaf edit should not drag the workspace with it (see docs/adr/0004)
[profile.dev]
opt-level = 0
debug = 1
incremental = true
