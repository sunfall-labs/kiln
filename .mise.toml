# Task definitions for this repository.
#
# Rust is pinned below for the checker's allocator API; mbx comes from the global mise config.
# Tasks name the repository checks. Run `mise tasks` to list them.
#
# Every task shells out to a script under `scripts/`, which is where this repository already keeps
# its runnable work -- these are a front door, not a second implementation.

[tasks.gate]
description = "Routine gate: crate tests, native parity, bundles and routine Test262"
run = "./scripts/gate.sh"

[tasks.gate-full]
description = "Complete gate, including extended Test262 and the postcss performance bundle"
run = "./scripts/gate.sh --full"

[tasks.gate-quick]
description = "Crate tests, native parity and thirdparty bundles -- the iteration loop"
run = "./scripts/gate.sh --quick"

[tasks.test262]
description = "Check routine Test262 coverage (extended cases are explicitly deferred)"
run = "./scripts/test262-baseline.sh"

[tasks.test262-full]
description = "Run every pinned Test262 case, including extended coverage"
run = "./scripts/test262-baseline.sh --suite full"

[tasks.test262-extended]
description = "Run just the expensive Test262 section; use for periodic or affected-feature checks"
run = "./scripts/test262-baseline.sh --suite extended"

[tasks.test262-update]
description = "Regenerate the Test262 baseline (deliberate: the diff is the record)"
run = "./scripts/test262-baseline.sh --update"

[tasks.test262-fetch]
description = "Fetch the pinned Test262 checkout into ~/.cache/kiln (needed once per machine)"
run = "./scripts/test262-fetch.sh"

[tasks.wpt]
description = "Check the committed Web Platform Tests baseline (the WinterTC Minimum Common API's conformance suite) through both engines"
run = "./scripts/wpt.sh"

[tasks.wpt-update]
description = "Regenerate the WPT baseline (deliberate: the diff is the record)"
run = "./scripts/wpt.sh --update"

[tasks.wpt-fetch]
description = "Fetch the pinned WPT directories into ~/.cache/kiln (needed once per machine)"
run = "./scripts/wpt-fetch.sh"

[tasks.bench]
description = "Every microbenchmark under bench/, under kiln, node and bun"
run = "./bench/compare.sh"

[tasks.realworld]
description = "Real-world TypeScript programs under kiln, node, bun, porffor and Hermes"
run = "./bench/realworld/compare.sh"

[tasks.native]
description = "Native backend against node, probe by probe"
run = "./scripts/native.sh"

[tasks.native-stress]
description = "The native corpus with the collector stressed on every allocation (minutes, not seconds)"
run = "KILN_NATIVE_GC_STRESS=${KILN_NATIVE_GC_STRESS:-1} ./scripts/native.sh"

[tasks.native-realms]
description = "Each native probe as 1, 2 and core-count realms at once in one process, each printing what it prints alone"
run = "./scripts/native-realms.sh"

[tasks.thirdparty]
description = "Real library bundles, both engines"
run = "./scripts/thirdparty.sh"

[tasks.http-close]
description = "The Node HTTP close contract, across all four seams"
run = "./scripts/check-http-close-contract.sh"

[tasks.silent-undefined]
description = "The expensive class: a native member read answering undefined (several hundred compiles)"
run = "./scripts/check-silent-undefined.sh"

[tasks.facts]
description = "Check the committed whole-program facts baseline for benchmarks and bundles"
run = "./scripts/facts-baseline.sh --check"

[tasks.facts-update]
description = "Regenerate the whole-program facts baseline (deliberate: the diff is the record)"
run = "./scripts/facts-baseline.sh --update"

[tasks.npm-compat]
description = "npm package compatibility corpus vs porffor's dashboard methodology (informational, not a gate)"
run = "./scripts/npm-compat.sh"

[tools]
rust = "nightly-2026-09-15"

