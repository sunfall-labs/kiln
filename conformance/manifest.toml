[[test]]
id = "regress/r09-sloppy-code-binds-globals-and-this"
group = "regress"
source = "regress/r09-sloppy-code-binds-globals-and-this.js"
status = "runnable"
features = ["sloppy-mode", "global-object", "this-binding", "reference-error", "functions"]
catches = """
CommonJS compiled as strict code. Node wraps a CommonJS file in an ordinary function, so its \
body is sloppy: an assignment to a name nothing bound creates a property on the global object, \
and `this` in a bare call is that object. Kiln raised a ReferenceError for the first and \
answered `undefined` for the second, which is exactly the pair a UMD header uses to install \
itself -- so a large fraction of real packages could not attach their module at all. The two \
lines after them pin what the fix must not take with it: reading a name nothing bound is still \
a ReferenceError, in sloppy code as in strict, and so is the read half of `notThere += 1`.\
"""
expected_stdout = """
object string installed
installed
true
compound: ReferenceError
read: ReferenceError
"""

