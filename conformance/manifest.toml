effect_api = ["Effect.gen", "Effect.succeed", "Effect.runSync"]
notes = """
The smallest program that needs both of the two defects that originally blocked Effect \
entirely: object spread keeping symbol keys, so the value has an `@@iterator` at all, and a \
generic iterator protocol, so `yield*` can drive it.\
"""
