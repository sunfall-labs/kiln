r09 asks for must be chosen by the source *goal* and not by the absence of a `"use strict"` \
directive. Applied by strictness alone, an undeclared assignment starts creating globals inside \
ESM too -- a wrong answer no bundle would ever surface, because every one of them is already \
strict, and one that only Test262's `language/module-code` would report.\
"""
