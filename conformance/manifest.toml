# kiln JavaScript conformance corpus - machine-readable index.
#
# Shape follows docs/design.md §9, which asks each test to declare what it exercises:
#
#     test: closures/capture-let.js
#     features: [lexical-environments, closures]
#     ir: [make_environment, load_capture, store_capture]
#
# `features` is carried over directly and is the field a changed-test selector keys on, so the
# tags are meant to be accurate rather than decorative: each one names a JavaScript semantic the
# test would actually stop passing without.
#
# §9's `ir` field is deliberately absent. Kiln has no IR operations yet, so every value would be
# invented, and an invented tag in a selector input is worse than a missing one - it would make
# the selector confidently wrong instead of conservatively broad. Add `ir` per test when the IR
# exists and the test has been observed to touch those operations.
#
# `status` records whether kiln's runner will attempt a test, and nothing more:
#
#     runnable      plain JavaScript; `kiln test conformance/guard` executes it and compares its
#                   stdout against `expected_stdout` below, byte for byte.
#     needs-bundle  a TypeScript entry point that imports a library. It runs only as a
#                   single-file bundle, which effect/build.sh produces out of process (npm ci +
#                   esbuild), so the runner reports it skipped-with-reason rather than failed.
#
# It deliberately says nothing about whether a test passes, and the runner deliberately does not
# read it - it decides from the file extension instead. A field in the file that records an
# expectation must never be able to decide whether that expectation is checked.
#
# The pass count is therefore not in this file and cannot be derived from it. It comes from
# `kiln test conformance/guard`, which runs every probe, prints the distribution of reasons for
# the ones that fail, and exits non-zero while any of them does. At the time of writing that is
# 0 of 21 passing, all of them refused during lowering: the interpreter supports no user function
# calls, no objects and no property access. That number is a measurement and will move; this file
# is not where it is recorded.
#
# `status.sh` still only reports what this file says, and still executes nothing. Its `--gate`
# checks that something *can* run, which is now true, so the gate that matters is the runner's
# exit code and not `status.sh --gate`.
#
# Provenance for the whole corpus is in [corpus] below.

[corpus]
name = "porffor-effect-findings"
source_repo = "~/Developer/Personal/oss/porffor-effect-findings"
source_commit = "bfdd2b0"
source_commit_subject = "porffor/Effect: findings, and the three regression gates"
ported = "2026-08-29"
guard_tests = 21
effect_tests = 12
total_tests = 32

# How the expected output in this file was obtained. Both halves were *observed*, not
# transcribed: every value below is what `node v25.9.0` actually printed on this machine.
[corpus.expected_output_method]
guard = """
Ran `node <probe>.js` for each of the 21 probes, capturing stdout and stderr merged, and \
recorded the bytes verbatim. The original corpus never stored expected output at all - its \
guard/run.sh diffs porffor's output against a live `node` run each time - so there was no \
recorded value to copy and it had to be produced. All 21 exit 0 and write nothing to stderr.\
"""
effect = """
Each program carries an `// expect:` comment, but those are lossy: they join lines with " | " \
and 12-service-layer's own output contains a literal " | ", so the comment alone cannot be \
parsed back into lines. So the bundles were built with build.sh and each was run under `node \
v25.9.0`, and the observed stdout recorded. Where the observation disagrees with the comment, \
the observation wins and the disagreement is recorded in `expect_comment_disagrees`.\
"""
node_version = "v25.9.0"
notes = """
Every test's output was checked for run-to-run stability. The timing-sensitive ones \
(guard/g07-timers-order, effect/06-sleep, effect/07-interruption, effect/12-service-layer) were \
run repeatedly and produced identical output every time under node. That stability is a \
property of node's scheduler, not a guarantee: under design.md §11 these should be driven by \
the mock event driver's virtual time rather than by real sleeping, and the tests tagged \
`event-loop` or `timers` are exactly the ones that will need it.\
"""

# ---------------------------------------------------------------------------------------------
# guard/ - 21 standalone probes, one behaviour each.
#
# `catches` records which compiler defect the probe was written to catch. In the source corpus
# that rationale lives in guard/gen.mjs (the generator), NOT in the probe files - only three of
# the twenty .js files carry any comment at all. The probes are copied here byte for byte, so
# rather than editing them to add comments, the rationale is lifted into this field and gen.mjs
# is carried alongside them unmodified.
# ---------------------------------------------------------------------------------------------

[[test]]
id = "guard/g01-spread-symbols"
group = "guard"
source = "guard/g01-spread-symbols.js"
status = "runnable"
features = ["object-spread", "object-rest", "symbol-keys", "well-known-symbols", "object-statics"]
catches = """
Object spread and rest dropping symbol-keyed own properties. Effect builds every prototype by \
spreading one proto into another, and `[Symbol.iterator]` is what makes an Effect yieldable, so \
losing symbol keys in spread makes `Effect.gen` impossible. Note that `Object.keys` must still \
exclude symbols - the probe asserts both halves at once.\
"""
expected_stdout = """
2 3 a
"""

[[test]]
id = "guard/g02-arrow-arguments"
group = "guard"
source = "guard/g02-arrow-arguments.js"
status = "runnable"
features = ["arrow-functions", "arguments-object", "closures", "array-methods"]
catches = """
Arrow functions not inheriting `arguments` from the enclosing function. `arguments` in an \
ordinary function, a method or a nested function expression is the easy case and was never \
broken; only the arrow-inherits case was. This is what Effect's `dual()` is built on, and \
`dual()` is how nearly every data-last/data-first Effect API is defined.\
"""
expected_stdout = """
2 3,3
"""

[[test]]
id = "guard/g03-class-field-closure"
group = "guard"
source = "guard/g03-class-field-closure.js"
status = "runnable"
features = ["classes", "class-fields", "closures", "lexical-environments", "arrow-functions"]
catches = """
Class instance-field initialisers not capturing the enclosing scope. Constructor-body \
assignment, methods, static fields and top-level instance fields all captured correctly; only \
an instance-field initialiser inside a function did not. `Data.TaggedError` is literally \
`tag => class Base extends Error { _tag = tag }`, so this breaks every tagged error at class \
definition time.\
"""
expected_stdout = """
T T
"""

[[test]]
id = "guard/g04-generic-forof"
group = "guard"
source = "guard/g04-generic-forof.js"
status = "runnable"
features = ["iterator-protocol", "well-known-symbols", "for-of", "array-spread", "arrow-functions"]
catches = """
No generic iterator protocol: `for..of` and spread dispatching on a fixed set of built-in type \
tags instead of looking up `@@iterator` and driving `.next()`. The spread half matters \
independently - the broken version failed silently, reading a length out of the object pointer \
and emitting garbage rather than throwing.\
"""
expected_stdout = """
3 0,1,2
"""

[[test]]
id = "guard/g05-yieldstar-protocol"
group = "guard"
source = "guard/g05-yieldstar-protocol.js"
status = "runnable"
features = ["generators", "yield-delegation", "iterator-protocol", "well-known-symbols", "classes", "two-way-generators"]
catches = """
`yield*` delegation over a user-defined iterable, with values passed back in through \
`.next(v)`. This is a faithful miniature of Effect's SingleShotGen: the class is its own \
iterator, returns itself from `@@iterator`, and yields once then completes with whatever was \
sent in. `yield*` lowered to a `for..of` inherits every `for..of` limitation, which is why this \
is a separate probe from g04.\
"""
expected_stdout = """
one,two ONETWO
"""

[[test]]
id = "guard/g06-array-proto-iterator"
group = "guard"
source = "guard/g06-array-proto-iterator.js"
status = "runnable"
features = ["well-known-symbols", "iterator-protocol", "prototype-chain", "computed-member-access"]
catches = """
`Array.prototype[Symbol.iterator]` existing as a real property rather than iteration being \
dispatched by type tag. This probe references nothing else on purpose. An earlier version of it \
also touched `[].values`, which silently forced the prototype to materialise and hid the fact \
that the fix only worked when some *other* construct in the same program had already triggered \
it. A one-line probe that names only the symbol is the whole point of the file.\
"""
expected_stdout = """
function
"""

[[test]]
id = "guard/g06b-array-iterator-identity"
group = "guard"
source = "guard/g06b-array-iterator-identity.js"
status = "runnable"
features = ["well-known-symbols", "iterator-protocol", "prototype-chain", "in-operator", "array-methods", "function-identity"]
catches = """
The companion to g06: the property must be *observable* (`Symbol.iterator in []`) and must be \
the same function object as `Array.prototype.values`, not a second one that merely behaves the \
same. Effect's `Effect.forEach` tests `Symbol.iterator in v` and refuses arrays if the answer \
is false, so presence-not-just-behaviour is load-bearing.\
"""
expected_stdout = """
true true
"""

[[test]]
id = "guard/g07-timers-order"
group = "guard"
source = "guard/g07-timers-order.js"
status = "runnable"
features = ["timers", "microtasks", "event-loop", "callback-ordering", "timer-arguments"]
catches = """
Timers existing at all, and firing in the right order relative to each other and to \
microtasks: `setTimeout` with extra arguments forwarded to the callback, `clearTimeout` before \
firing, `setInterval` cleared from inside its own callback, and `queueMicrotask` draining \
before any timer. A later change unified two separate timer implementations and this probe is \
what caught the two bugs that unification introduced.\
"""
expected_stdout = """
a
b
micro
args p
iv 1
iv 2
late
"""

[[test]]
id = "guard/g08-finally-paths"
group = "guard"
source = "guard/g08-finally-paths.js"
status = "runnable"
features = ["try-finally", "abrupt-completion", "completion-values", "exceptions", "loops", "break-continue"]
catches = """
`finally` being skipped on abrupt completion. It ran correctly for normal completion and for a \
caught-and-handled exception, and was dropped when the `try` exited via `return`, via a \
propagating throw, or via `break`/`continue` out of a loop. Silent wrong behaviour rather than \
a crash, which makes it the nastiest kind: every JS-level resource cleanup and every generator \
`.return()` cleanup used for interruption just did not happen. The four exit paths are all in \
one file deliberately.\
"""
expected_stdout = """
finA
A
finB
caught B
fin 0
fin 1
fin 2
done
"""

[[test]]
id = "guard/g09-error-subclass"
group = "guard"
source = "guard/g09-error-subclass.js"
status = "runnable"
features = ["classes", "inheritance", "derived-constructors", "error-objects", "error-subclassing", "instanceof", "global-object", "to-string"]
catches = """
`class X extends Error` producing a working Error. The broken version modelled errors as a \
distinct primitive type tag rather than an object with a real prototype chain, so `instanceof \
Error` was a type-tag range check a user subclass could never satisfy, `.message` was undefined \
on a subclass, and `String(e)` gave `[object Object]`. The second half - `extends \
globalThis.Error` - is a separate path from `extends Error` and had to be checked separately.\
"""
expected_stdout = """
true true boom E T E: boom
true g
"""

[[test]]
id = "guard/g10-builtin-statics"
group = "guard"
source = "guard/g10-builtin-statics.js"
status = "runnable"
features = ["builtin-statics", "global-object", "object-statics", "array-statics", "json"]
catches = """
A constructor's static methods being reachable through a *variable* holding the constructor, \
not only through its global name. Effect does `const Array = globalThis.Array` and then \
`Array.isArray(...)`; a compiler that resolves `Array.isArray` as a static name at the call \
site gets this wrong. The later fix also replaced a regex source-scan with a real data source, \
which turned up several statics the scan had silently missed.\
"""
expected_stdout = """
function function function function
true x
"""

[[test]]
id = "guard/g11-proto-on-function"
group = "guard"
source = "guard/g11-proto-on-function.js"
status = "runnable"
features = ["set-prototype-of", "prototype-chain", "function-objects", "classes", "inheritance", "static-inheritance", "well-known-symbols"]
catches = """
A prototype set on a *function* being honoured for lookups, including symbol-keyed ones, and \
being inherited by a subclass through the static side. This is exactly what \
`Context.Service` does: `Object.setPrototypeOf(KeyClass, ServiceProto)`, with the yieldable \
`@@iterator` living on that prototype - so `yield* MyService` in an `Effect.gen` resolves \
through it.\
"""
expected_stdout = """
function f T function T
"""

[[test]]
id = "guard/g12-private-not-inherited"
group = "guard"
source = "guard/g12-private-not-inherited.js"
status = "runnable"
features = ["classes", "private-methods", "private-fields", "static-methods", "inheritance", "exceptions", "brand-checks"]
catches = """
Private-name brand checks. A static private method called through a subclass must throw a \
TypeError, because the subclass constructor is a different object and was never branded - while \
an *instance* private method must still be reachable from an inherited public method. The two \
halves pull in opposite directions, which is why they are in one probe.\
"""
expected_stdout = """
42
threw TypeError
inherited instance private: 7
private brand: true false
"""

[[test]]
id = "guard/g13-set-mutation"
group = "guard"
source = "guard/g13-set-mutation.js"
status = "runnable"
features = ["set", "iterator-protocol", "for-of", "mutation-during-iteration"]
catches = """
Deleting from a Set while iterating it. The broken version compacted the dense backing array \
under a live cursor and compared the cursor against a shrinking count, so the walk skipped \
entries. Effect's `race` and `timeout` interrupt their children by doing exactly this - \
deleting each child from a Set as it iterates - so this single bug blocked all of interruption.\
"""
expected_stdout = """
3 a,b,c 0
"""

[[test]]
id = "guard/g14-generator-return-finally"
group = "guard"
source = "guard/g14-generator-return-finally.js"
status = "runnable"
features = ["generators", "generator-return", "try-finally", "abrupt-completion", "json"]
catches = """
`generator.return(v)` unwinding the suspended body so its `finally` runs, and then completing \
with `{ value: v, done: true }`. This is the mechanism a fiber runtime uses to interrupt a \
suspended computation; without it, interruption silently skips all cleanup.\
"""
expected_stdout = """
1
cleanup
{"value":"early","done":true}
"""

[[test]]
id = "guard/g15-error-stack-cause"
group = "guard"
source = "guard/g15-error-stack-cause.js"
status = "runnable"
features = ["error-objects", "error-cause", "error-stack", "builtin-statics"]
catches = """
The three Error surfaces Effect actually reads: `.stack` present and a string, the `cause` \
option preserved by identity, and `Error.captureStackTrace` existing. Note what is *not* \
asserted - the content of `.stack`. In the source project real frames were unobtainable \
because the release build strips unwind tables, so `.stack` is the header-only shape V8 gives \
under `Error.stackTraceLimit = 0`. Kiln can do better here; the probe is a floor, not a ceiling.\
"""
expected_stdout = """
string true function
"""

[[test]]
id = "guard/g16-array-from-iterable"
group = "guard"
source = "guard/g16-array-from-iterable.js"
status = "runnable"
features = ["array-from", "iterator-protocol", "generators", "array-spread", "well-known-symbols"]
catches = """
`Array.from` going through `@@iterator` rather than reading a length, checked against array \
spread on the same object so the two paths cannot drift apart. The subject is an object literal \
with a generator method as its `@@iterator`, which is the shape Effect's Chunk hands to \
`Array.from`.\
"""
expected_stdout = """
1,2 1,2
"""

[[test]]
id = "guard/g17-set-map-iterator"
group = "guard"
source = "guard/g17-set-map-iterator.js"
status = "runnable"
features = ["well-known-symbols", "iterator-protocol", "prototype-chain", "set", "map", "string-iteration", "generators"]
catches = """
`@@iterator` present as a real property on Set, Map, String and generator objects - the same \
presence-not-just-behaviour requirement as g06b, applied to the other four iterable built-ins. \
Fixing this also surfaced two generator prototype branches that had been dead code because of a \
doubled name prefix.\
"""
expected_stdout = """
function function function
undefined undefined undefined
function
undefined
"""

[[test]]
id = "guard/g18-iterator-close"
group = "guard"
source = "guard/g18-iterator-close.js"
status = "runnable"
features = ["iterator-protocol", "iterator-close", "for-of", "abrupt-completion", "well-known-symbols"]
catches = """
IteratorClose: `break` out of a `for..of` calling the iterator's `return()`. Worth reading \
alongside the README's methodology section - the fix for this probe introduced a bug where an \
iterator that was never opened got closed anyway, and that bug passed this probe and showed no \
test262 regression. Only a real Effect program caught it. In the source project only `break` \
closed; `return`, `throw` and labelled jumps did not, and that limit was accepted deliberately.\
"""
expected_stdout = """
closed
"""

[[test]]
id = "guard/g19-subclass-array-map"
group = "guard"
source = "guard/g19-subclass-array-map.js"
status = "runnable"
features = ["classes", "inheritance", "derived-constructors", "builtin-subclassing", "instanceof", "array-methods", "map"]
catches = """
Real derived-constructor semantics over built-ins: `this` binding to the result of `super()` \
rather than to a freshly allocated ordinary object, so `class A extends Array` is an actual \
Array and `class M extends Map` is an actual Map. Getting this right is what let the source \
project delete a special-cased Error patch entirely - Error subclassing stopped needing its own \
mechanism once derived constructors were correct.\
"""
expected_stdout = """
true 1
true 1
"""

# ---------------------------------------------------------------------------------------------
# effect/ - 12 real Effect-TS programs, in increasing order of difficulty.
#
# These are not probes. Each is a small but genuine program that exercises a whole library at
# once, and they exist because probes and broad conformance suites both miss things that real
# programs hit. See README.md, "Why the real programs are a separate gate".
#
# `source` is the TypeScript entry point. `bundle` is the single-file ESM output build.sh
# produces from it; `bundle_inputs` names the shared build inputs whose exact bytes join the
# source in the adjacent `.kiln-inputs` provenance record. The runner rejects a bundle unless
# that record matches. Bundles are not committed (see .gitignore) except the fixture noted in
# [[fixture]] at the end of this file.
#
# `features` names JavaScript semantics, because that is what a selector over compiler changes
# needs. `effect_api` separately names the library surface, which is what a human reading this
# file wants to know.
# ---------------------------------------------------------------------------------------------

[[test]]
id = "effect/01-core"
group = "effect"
source = "effect/src/01-core.ts"
bundle = "effect/bundle/01-core.js"
bundle_inputs = ["effect/package.json", "effect/package-lock.json", "effect/build.sh"]
status = "needs-bundle"
features = ["modules", "module-semantics", "promises", "microtasks", "closures", "arrow-functions", "prototype-chain", "object-spread", "symbol-keys"]
effect_api = ["Effect.succeed", "Effect.map", "Effect.flatMap", "pipe", "Effect.runSync", "Effect.runPromise"]
expected_stdout = """
runSync 1
pipe 20
promise 5
"""

[[test]]
id = "effect/02-gen"
