[[test]]
id = "regress/r01-handler-outlives-frame"
group = "regress"
source = "regress/r01-handler-outlives-frame.js"
status = "runnable"
features = ["exceptions", "try-finally", "abrupt-completion", "handler-lifetime", "functions"]
catches = """
An exception handler outliving the frame that installed it. A `return` out of a `try` jumps past \
the `PopHandler` that balances its `PushHandler`, so unless handlers are dropped with their \
frame, the next `throw` with no legitimate handler in between lands on a code offset belonging \
to a function that has already returned -- and executes whatever instruction happens to live \
there in the *current* one. Only observable when nothing else is on the handler stack to shadow \
the leaked entry, which is why the throw here is not wrapped.\
"""
expected_stdout = """
start 1
caught boom
"""

[[test]]
id = "regress/r02-generator-resumed-at-another-depth"
group = "regress"
source = "regress/r02-generator-resumed-at-another-depth.js"
status = "runnable"
features = ["generators", "try-finally", "iterator-protocol", "abrupt-completion", "generator-return"]
catches = """
A generator's saved operand stack is restored wherever the resuming caller's stack happens to \
end, so any handler position recorded as an absolute index is stale on the next resumption. This \
resumes at three different depths before unwinding through the `finally`. The equivalent in g14 \
is reached only through `JSON.stringify`, which hid the cause behind a missing builtin; this \
probe isolates it.\
"""
expected_stdout = """
1
2,3
early true cleanup
"""

