conformance/server/packages/. The directory is gitignored for the same reason effect/bundle/ \
is - it is reproducible from package-lock.json and is 41 packages of machine output.

This is deliberately NOT bundled the way the Effect programs are. ADR 0027's bare-specifier \
policy and the CommonJS graph now execute Fastify's real dependency tree. Bundling would erase \
exactly that maintained compatibility boundary, so the probe keeps its imports.\
"""
expected_stdout = """
200 {"ok":true}
200 {"id":"7"}
200 {"got":{"hello":"kiln"}}
404 {"error":"not found"}
"""

