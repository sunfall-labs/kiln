catches = """
Issue 14 of `docs/issues/realms-and-concurrency`. Delivery: node dispatches a port's messages from \
one callback with a full checkpoint (ticks, then promise jobs, then an async handler's later \
awaits) between two messages, and each port's queue as one batch, so `B1` comes after all of `A`. \
Delivering the queue from one `setImmediate` without the checkpoint, or one `setImmediate` per \
message, interleaves differently. An `onmessage` handler is a listener in the position it was \
first set in, and sees `target`.

Transfer: `postMessage(msg, [buf])` and `structuredClone(v, { transfer })` detach the sender's \
buffer (and every view over it) and hand the bytes over; until 2026-09-26 the list was ignored \
and the "transfer" was a copy, and `ArrayBuffer.prototype.transfer` set an own `detached` \
property over bytes the views could still read. A clone that fails half way detaches nothing. \
`markAsUntransferable` is honoured. The DataCloneError messages and codes are node's.

The clone: shared references and cycles survive, holes stay holes, an own `__proto__` key stays \
an own key, a class instance becomes a plain object, and a function, a symbol or a promise is a \
DataCloneError. The interpreter's Rust clone answered the same Map it was given.\
"""
