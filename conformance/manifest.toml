Every parameter form, and one silent wrong answer in particular: oxc keeps a parameter's default \
on the `FormalParameter` rather than inside its binding pattern, so a frontend that reads only \
`item.pattern` sees a plain identifier for `f(x = 1)` and drops the default without a \
diagnostic. The refusal guard around destructuring never fired, because the pattern really is \
just an identifier. Also pins what a default applies to (`undefined` only), that it is evaluated \
per call, that rest is an empty array rather than undefined, that `arguments` reports what was \
passed rather than what was defaulted, and that a closure written *in another parameter's \
default* still shares the binding -- the one capture the body-only analysis cannot see.\
"""
