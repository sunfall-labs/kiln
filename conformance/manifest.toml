[[test]]
id = "effect/09-fiber"
group = "effect"
source = "effect/src/09-fiber.ts"
bundle = "effect/bundle/09-fiber.js"
bundle_inputs = ["effect/package.json", "effect/package-lock.json", "effect/build.sh"]
status = "needs-bundle"
features = ["modules", "module-semantics", "global-object", "in-operator", "timers", "event-loop", "promises", "microtasks", "closures"]
effect_api = ["Effect.forkChild", "Fiber.join", "Effect.flatMap", "Effect.runPromise"]
notes = """
This is the module-semantics test. Effect picks its scheduler with `"setImmediate" in \
globalThis ? ... : setTimeout`, wrapped around its own top-level binding. If top-level `var` in \
a module leaks onto the global object, the wrong branch is taken and fork scheduling breaks - \
which is why the bundles must be run with module semantics even though esbuild has already \
removed every import and export.\
"""
