# ---------------------------------------------------------------------------------------------
# server/ - 4 probes for the compiled-Node-server target, authored in this repository.
#
# These are a horizon marker rather than a backlog rung. Every other group asks a question the
# ladder in docs/language-coverage.md already answers in order; this group asks the one that
# design.md §14 step 10 ("Node compatibility graft") names and nothing has reached yet. They are
# a separate group so the [corpus] counts above keep meaning "what was ported from
# porffor-effect-findings" and the [regress] count keeps meaning "defects already found".
#
# Two properties of a server break the shape every other probe relies on, and both are handled
# in the probe rather than in the runner.
#
# A server does not terminate, and its output goes to a socket rather than to stdout. So each
# probe is *self-driving*: it listens on port 0, issues a fixed sequence of requests to itself
# through node:http, prints one line per response, and closes the server. That leaves them
# ordinary single-file programs with byte-comparable stdout, executed by the existing runner
# with no new machinery, and it keeps a failure naming a defect rather than a region.
#
# A response carries a `Date:` header from the host clock, and ADR 0015 gave the realm a virtual
# clock starting at the epoch. No probe prints a response header kiln does not itself set, so
# none of them can be made to pass by reading the host clock. That collision is real, and it is
# what ADR 0031 was written to answer: the clock, entropy, timezone and locale become realm
# capabilities whose defaults are today's constants. So these four are expected to pass in the
# deterministic realm - a server that works only by reading the real clock is not finished.
#
# Requests are issued sequentially, never concurrently, so the recorded output does not depend
# on the order two responses happen to complete in.
[[test]]
id = "regress/r08-node-async-context"
requires_host = "node"
group = "regress"
source = "regress/r08-node-async-context.js"
status = "runnable"
features = ["node-util", "node-async-hooks", "async-local-storage", "promise-jobs", "timers", "text-encoding"]
catches = """
An async store that is only correct synchronously, which is worse than not having one: it \
answers on the near side of an `await` and answers `undefined` on the far side, which is exactly \
the shape a request-scoped trace id is used in. The store has to be captured where work is \
*queued* and restored where it runs.

Two captures, and the second is the one that is easy to get wrong. A timer captures where it was \
set. A promise reaction captures where it was *attached*, not where the promise settled -- a \
promise is very often settled by unrelated code with a context of its own, and `Promise.all` \
resolves inside whichever input finished last, so a handler that inherited the settler's context \
saw a store belonging to another task. The last line here is the whole point: after two \
concurrent `run`s, the code that awaited them is back outside both and must see no store at all. \
Stamping reactions at settle time answered `Y`.

This is also what blocked `react-dom/server`, which constructs `new util.TextEncoder()` and `new \
async_hooks.AsyncLocalStorage()` in its top-level `var` list. Both were missing, so both read \
`undefined`, and "undefined is not a constructor" named neither the module nor the property.\
"""
expected_stdout = """
encoder 104,105
outside undefined
sync 1
restored undefined
args 10
threw boom undefined
two a b
inner a undefined
exit undefined back a
A entered A
A past await A
A past timer A
then B
timer T
X entered X
Y entered Y
X past await X
Y past await Y
X past timer X
Y past timer Y
done undefined
"""

[server]
tests = 6
authored = "2026-08-30"
target = """
A Node HTTP server, compiled. design.md §14 places the compatibility graft at step 10 and the \
async event loop at step 11; docs/language-coverage.md's ten-step ladder is a prerequisite for \
all four of these, and the corpus is currently at step 0. Nothing here is expected to pass for \
a long time. The value is the refusal, which names the next thing in the way.\
"""
expected_output_method = """
Ran each probe under `node v25.9.0` on this machine, stdout and stderr merged, and recorded the \
bytes verbatim. All four exit 0 and write nothing to stderr. Each was then run 30 times and \
produced identical output every time, which is what qualified the assertions below: the first \
draft of s03 also printed the number of `data` events the request body arrived in, and that is \
removed rather than recorded. It was stable, but it is stable as a property of node's stream \
implementation and of loopback TCP rather than of JavaScript, and requiring kiln to reproduce \
node's write coalescing would be over-specification. Reassembling the chunks is the semantic \
being asserted; how many there were is not.\
"""
observed_refusal = """
Superseded by observation. Kept as the record of what these four said before anything ran, \
because the point of the group was always the refusal rather than the pass, and a backlog that \
deletes its own history cannot show that it was worked.

On 2026-08-30 all four refused during lowering: three wanted `module dependency `node:http` is \
not supported by this execution backend`, s04 wanted the same for `fastify`. By hand, \
`kiln run` refused `node:http` earlier still - `invalid module specifier: URL schemes are not \
supported` - while a probe importing only `fastify` reached `imports missing export `default``, \
naming `node_modules/fastify/fastify.js`, which showed ADR 0027's resolver already found the \
real file and located the gap in CommonJS interop rather than in package resolution.

On 2026-08-31, with `--node`, all four pass. `kiln --one-shot test conformance --node` reports \
43 of 43, including the twelve Effect bundles. Ordinary mode still refuses `node:` specifiers, \
which is a product boundary rather than a gap: the node surface is opt-in.\
"""
observed_native = """
The compiled form, which is what the group exists for. `s01` builds through `kiln build --node` \
and the resulting executable serves the recorded bytes, at 8ms to first response, 3.3 MiB \
resident and 4.6 MiB on disk - against 24ms/24.4/60.9 for `bun build --compile` and \
27ms/34.7/64.3 for `deno compile`, measured by scripts/server-baseline.sh on the same file.

The remaining server probe refuses with a named semantic backlog entry rather than a generic \
control error, which is the distribution doing its job. Native graph construction now crosses \
the deterministic `node:util`, `node:diagnostics_channel`, `node:dns`, and `node:os` facades, plus \
the explicitly capability-gated `node:https` and `node:http2` namespaces. Its next boundary is \
`node:stream`, whose classes must preserve lifecycle semantics rather than merely exist.\

`s02` now builds and passes through the same public standalone path as `s01`. Its three requests \
exercise async routing, the native WHATWG URL constructor and URLSearchParams lookup, JSON \
responses, loopback HTTP client/server operation, and orderly shutdown. The URL implementation \
uses ordinary runtime objects and the existing percent-decoder; it adds no value tag, ABI type, \
executor, or transport path. \

`s03` also passes both public native paths. Incoming HTTP body chunks are Buffer views over the \
existing Uint8Array storage, so `Buffer.concat`, byte length, and UTF-8 decoding add no second \
byte container or ABI type. The native-run and standalone gates copy the canonical corpus file \
and require the same recorded JSON as interpreted mode. \

Getting `s01` there needed one fix, recorded because the shape of it will recur. The public \
`node:http` export list is declared beside its TypeScript source, so both graph engines compile and \
link the same names. The regression remains in the native and interpreter HTTP identity tests, which \
exercise the complete source export contract and the private host capability separately.

The interpreter and native backend now agree with node that object-shaped builtin defaults such \
as `http`, `net`, `async_hooks`, `string_decoder` and `perf_hooks` have `typeof` `object`, while \
the genuinely callable defaults (`assert`, `events`, `module` and `stream`) remain functions. A \
focused interpreter test pins that split, and the native export-slot test pins materialization.\
"""
extension_finding = """
The probes are `.mjs` rather than `.js`, and that exposed a real harness boundary. The first \
draft used `.js` and was parsed as Script, refusing with `Cannot use import statement outside a \
module`: a harness-shaped answer naming the runner's own default instead of kiln's server gap. \
Node-mode conformance now uses the production format policy: `.mjs` is ESM, `.cjs` is CommonJS, \
and `.js` follows the nearest package.json `type`; deleting the manifest reclassifies the next \
run. Ordinary non-Node corpus programs retain their explicit extension/Script behavior. These \
four remain `.mjs` so their format is self-contained, while `.js`-plus-`type` is now covered by \
the runner's focused regression tests rather than left as a step 10 backlog item.\
"""

