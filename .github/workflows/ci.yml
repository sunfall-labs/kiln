name: CI

# The fast, blocking loop: formatting, lints, tests, supply chain. Anything that measures
# wall-clock time lives in perf.yml, because it needs a different cache policy and a different
# idea of what "failing" means.
#
# design.md ranks iteration speed second only to correctness, and CI is one of the loops that
# gets iterated on. The jobs below are independent on purpose so that a formatting slip is
# reported in well under a minute instead of behind a full workspace build.
#
# Not run on push. main receives a commit every few minutes from several sessions, and with
# `cancel-in-progress` every run was cancelled by the next before it finished -- twelve in a row
# on 2026-10-02, none to completion, and the last one that did complete (2026-09-29) was red. A
# check that never reports is noise with a bill attached. The blocking loop is local:
# `scripts/pre-push.sh` runs the contracts and the core crate tests against what actually changed,
# and `mise run gate` is the full assembly. This workflow stays runnable by hand and on a release
# tag, like conformance.yml and perf.yml.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A superseded push has nothing useful left to say, and a short queue is the difference
  # between CI being part of the loop and being something you go and do other work during.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain named by rust-toolchain.toml, with the rustfmt and clippy
      # components it declares. With no toolchain argument rustup installs the active one, so
      # the pin lives in exactly one place.
      - run: rustup toolchain install --no-self-update
      # Registry only: `cargo fmt --all` resolves the workspace before it formats anything, and
      # this job is meant to be the one that answers in under a minute.
      - uses: Swatinem/rust-cache@v2
        with:
          key: fmt
          cache-targets: "false"
      - run: cargo fmt --all --check
      # The scripts these workflows call are as much a part of the build as the Rust is.
      # shellcheck is preinstalled on the runner image. --external-sources so it follows
      # scripts/lib.sh into the scripts that source it instead of reporting SC1091.
      - run: shellcheck --external-sources scripts/*.sh

  clippy:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install --no-self-update
      # Third-party, but it prunes stale artifacts out of the cached target directory, which a
      # hand-rolled actions/cache does not - without that the cache grows without bound and
      # eventually costs more to restore than the build costs to redo.
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      # kiln-host-gui's Linux widget backend links GTK 4 (ADR 0074), and the workspace builds it.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      # kiln-host-gui's Linux widget backend links GTK 4 (ADR 0074), and the workspace builds it.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev
      # Invoked through bash rather than by its executable bit, so a checkout that lost the
      # mode still runs.
      - run: bash scripts/ci-test.sh

  deny:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The action ships the cargo-deny binary, so this job compiles nothing: it reads
      # Cargo.lock and the manifests and finishes in seconds, which is what keeps it off the
      # critical path of the build jobs above. It also fails loudly if the binary cannot be
      # installed, where a `cargo install || true` style step would report a green tick for a
      # policy nobody checked.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Named explicitly rather than left to the action's default, so a change to that
          # default cannot quietly stop checking one of the four.
          command: check advisories licenses bans sources
