name: debug ptr48 arm64
on:
  push:
    branches: [debug/ptr48-arm64]
jobs:
  arm64:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup toolchain install --no-self-update
      - uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240
        with:
          toolchain: nightly-2026-09-15
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb nodejs
      - run: mbx build --release -p kiln-cli
      - name: programs
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          K=$GITHUB_WORKSPACE/target/release/kiln
          mkdir -p /tmp/p && cd /tmp/p
          echo '1+1' > empty.js
          echo 'const s: string = "hello"; console.log(s);' > hello.ts
          cat > rare.mjs <<'JS'
          const b = 10n ** 20n + 7n;
          const t = Temporal.PlainDate.from("2026-10-12").add({ days: 3 });
          const m = new Map([[1, { a: 1 }], ["k", [1, 2, 3]]]);
          const s = new Set([b, t.toString()]);
          console.log(String(b), t.toString(), m.get(1).a, m.get("k").length, s.size, typeof b);
          JS
          cat > http.mjs <<'JS'
          import http from "node:http";
          const server = http.createServer((q, r) => r.end("hi " + q.url));
          server.listen(0, "127.0.0.1", async () => {
            const res = await fetch(`http://127.0.0.1:${server.address().port}/x`);
            console.log(res.status, await res.text());
            server.close();
          });
          JS
          for f in empty.js hello.ts rare.mjs http.mjs; do
            for prof in native-dev native-release; do
              out=./$(basename $f | tr . _)-$prof
              timeout 300 $K --one-shot build $f --profile $prof --output $out
              timeout 60 $out; echo "== $f $prof exit=$?"
            done
            echo "-- interpreter:"; timeout 60 $K --one-shot run $f
          done
          KILN_GC_STRESS=1 ./rare_mjs-native-dev; echo "== rare gc-stress exit=$?"
          gdb -q -batch -ex run -ex bt ./hello_ts-native-dev > /tmp/gdb.log 2>&1 || true
          cat /tmp/gdb.log
          ! grep -q SIGSEGV /tmp/gdb.log
      - name: native corpus sample
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          python3 - <<'PYTHON' > /tmp/probes.txt
          from pathlib import Path
          import re
          paths = sorted(p for p in Path("conformance/native").iterdir() if p.suffix in (".js", ".mjs", ".cjs", ".ts"))
          selected = [p for p in paths if re.search("bigint|temporal|shared|collection|map|set|actor|cell|closure|http|json|string|array|class|promise|error|parallel", p.name, re.I)]
          print("\n".join(map(str, selected[:110])))
          PYTHON
          # Previous shell inventory could hide SIGPIPE or an empty corpus.
          test "$(wc -l < /tmp/probes.txt)" -eq 110
          # 'bigint|temporal|shared|collection|map|set|actor|cell|closure|http|json|string|array|class|promise|error|parallel' | head -110 > /tmp/probes.txt
          wc -l < /tmp/probes.txt
          KILN_NATIVE_TIMEOUT_SECONDS=180 KILN_BIN=$GITHUB_WORKSPACE/target/release/kiln KILN_JOBS=4 ./scripts/native.sh $(cat /tmp/probes.txt) > /tmp/native.log 2>&1
          cat /tmp/native.log
      - name: retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ptr48-arm64-evidence
          path: |
            /tmp/native.log
            /tmp/gdb.log
            /tmp/probes.txt
          if-no-files-found: warn
