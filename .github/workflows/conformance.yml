name: Conformance

# design.md §13 gates on recorded numbers. This workflow records the JavaScript conformance
# corpus's, and holds it to the one rule that matters while the compiler is still being built:
# the count of passing tests goes up, and never quietly comes back down.
#
# Three jobs, independent for the same reason ci.yml's are - a fact worth restating, because the
# temptation to fold this into the build job is exactly what would cost it. The inventory needs
# no toolchain and answers in seconds; putting it behind a workspace build would spend a build's
# wall clock to read two files.
#
#   inventory  conformance/status.sh, into the job summary: what the corpus contains and what has
#              actually been recorded about it. Reports, and does not gate.
#   gate       scripts/ci-conformance.sh: run the corpus, compare it against the committed
#              baseline, and fail if a test that used to pass no longer does. The blocking half.
#   differential
#              scripts/differential.sh: compare exploratory probes byte-for-byte with Node and
#              fail when kiln silently computes a different answer. Explicit refusals remain a
#              visible backlog rather than pretending the currently supported subset is larger.
#
# `conformance/status.sh --gate` is deliberately not what the gate job runs, although it exists
# and reports the corpus inventory as a human-readable diagnostic. The gate job compares the
# runner's per-test document against the committed baseline; `--gate` remains useful locally when
# developing the corpus because it also fails while tests remain unrun or failing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A superseded push has nothing useful left to say.
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  inventory:
    name: Corpus inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain, and no cache to restore: status.sh reads two files with bash and python3,
      # both of which the runner image already has. Invoked through bash rather than by its
      # executable bit, so a checkout that lost the mode still runs.
      - run: bash conformance/status.sh

  gate:
    name: Regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain named by rust-toolchain.toml. conformance/run.sh invokes the public
      # kiln CLI through cargo, with --locked so CI and local runs use the same dependency graph.
      - run: rustup toolchain install --no-self-update
      # Third-party, but it prunes stale artifacts out of the cached target directory, which a
      # hand-rolled actions/cache does not - without that the cache grows without bound and
      # eventually costs more to restore than the build costs to redo.
      - uses: Swatinem/rust-cache@v2
        with:
          key: conformance
      - run: bash scripts/ci-conformance.sh
      # Uploaded even when the comparison failed: a run that just tripped the gate is exactly the
      # one whose per-test detail is worth reading. `ignore` rather than `warn` because a runner
      # that fails before writing a document is diagnosed by the gate itself, and a warning
      # annotation on every run is how a warning stops being read.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results-${{ github.run_id }}
          path: target/conformance/results.json
          if-no-files-found: ignore
          retention-days: 30

  differential:
    name: Node differential oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install --no-self-update
      # Pin the language oracle to the current LTS major. Patch updates retain security fixes,
      # while a future major cannot silently change the reference underneath an old pull request.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@v2
        with:
          key: differential
      # This is deliberately its own gate. The recorded corpus catches known regressions; this
      # catches the more dangerous case where kiln accepts a probe and computes the wrong value.
      - run: bash scripts/differential.sh
