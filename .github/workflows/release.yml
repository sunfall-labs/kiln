name: Release

# Builds kiln for every supported target and, on a `v*` tag, publishes a GitHub release with one
# archive per target. scripts/package-release.sh is the whole recipe -- this workflow only picks
# runners and moves files -- so a release can be reproduced on a laptop with the same command.
#
# Each archive holds bin/kiln and lib/kiln/ (every native provider variant), so a machine with a
# C compiler and no Rust toolchain can `kiln build`. The script smoke-tests the unpacked archive
# with no cargo or rustc on PATH before it writes it.
#
# Actions are pinned to commit SHAs (the tag is in the comment beside each): a release must not
# change because someone moved a tag. Bump a pin deliberately, in its own commit.
#
# Targets are the ones the project measures: macOS on Apple silicon and Linux (glibc) on x86_64.
# Linux arm64 is not built yet: its native programs crash at startup, because the value layout
# keeps 47-bit pointers and arm64 Linux maps the program above 2^47
# (docs/issues/arm64-linux-48-bit-pointers.md). Intel macOS and Windows are not built: no one
# measures them, and ADR 0018's target matrix was never adopted. Linux archives carry no GUI provider (the bridge is AppKit today).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a draft release from this run (a tag push always publishes)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: read
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A tag that disagrees with the workspace version would publish archives whose
          # names and `kiln --version` contradict the release they are attached to.
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi

  # A release ships only a dependency tree that passes deny.toml: no known advisory (each ignore
  # carries its reason there), no licence outside the allow list, no source but crates.io.
  supply-chain:
    name: Supply chain (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  package:
    name: Package ${{ matrix.target }}
    needs: [version, supply-chain]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            # The oldest supported image, so the binary's glibc floor is as low as it can be.
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install --no-self-update
      # mbx, the build cache this repository uses everywhere (AGENTS.md), backed by the GitHub
      # Actions cache: a release after the first reuses the compiled workspace instead of building
      # every crate and provider variant cold. Tag pushes restore; manual dispatches also save.
      - uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1
        with:
          toolchain: nightly-2026-09-15
          save-on-workflow-dispatch: true
      # The packager re-execs under bash 4 (macOS ships 3.2) and the provider build links a
      # probe with the system C compiler, which every runner image already has.
      - if: runner.os == 'macOS'
        run: brew install bash
      - run: scripts/package-release.sh --target ${{ matrix.target }} dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kiln-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, package]
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          tag="v$VERSION"
          # The notes are CHANGELOG.md's section for this version; without one, GitHub's
          # generated list of commits stands in.
          awk -v v="$VERSION" '/^## \[/{on=index($0,"## [" v "]")==1; next} /^\[[^]]*\]: /{next} on' CHANGELOG.md > notes.md
          if [[ -s notes.md ]]; then
            flags=(--title "kiln $VERSION" --notes-file notes.md)
          else
            flags=(--title "kiln $VERSION" --generate-notes)
          fi
          # A manual run makes a draft for review; only a tag publishes.
          if [[ $GITHUB_REF_TYPE != tag ]]; then
            flags+=(--draft --target "$GITHUB_SHA")
          fi
          gh release create "$tag" "${flags[@]}" dist/*.tar.gz dist/SHA256SUMS scripts/install.sh
