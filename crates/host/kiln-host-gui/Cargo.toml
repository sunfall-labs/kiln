[package]
name = "kiln-host-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
rfd = { version = "0.15", default-features = false, features = ["tokio"] }
arboard = { version = "3.4", default-features = false }
dark-light = "1.1"
tray-icon = { version = "0.26", default-features = false }
muda = { version = "0.21", default-features = false }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "4.0"
global-hotkey = { version = "0.8", default-features = false }
taffy = { version = "0.14", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.4", default-features = false, features = ["wayland-data-control"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
