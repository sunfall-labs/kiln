[package]
name = "kiln-host-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# The GTK 4 widget backend on Linux (src/gtk.rs). It links libgtk-4, so building it needs the
# GTK 4 development files (`libgtk-4-dev`); `--no-default-features` builds the library without a
# widget backend, where `kiln_gui_init` reports that there is none. No effect on other platforms.
default = ["gtk"]
gtk = ["dep:gtk4"]

[dependencies]
rfd = { version = "0.15", default-features = false, features = ["tokio"] }
arboard = { version = "3.4", default-features = false }
dark-light = "1.1"
tray-icon = { version = "0.26", default-features = false }
muda = { version = "0.21", default-features = false }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "4.0"
global-hotkey = { version = "0.8", default-features = false }
taffy = { version = "0.14", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.4", default-features = false, features = ["wayland-data-control"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
# GTK 4.10 or newer: the accessibility API (GtkAccessible) the backend reports through.
gtk4 = { version = "0.11", optional = true, features = ["v4_10"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
