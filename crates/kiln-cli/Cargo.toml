[package]
name = "kiln-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kiln-proto = { workspace = true }
# For content_hash alone: the sync handshake is sound only if both ends compute a file's hash
# the same way, so the client borrows the database's definition rather than writing one.
kiln-db = { workspace = true }
serde_json = { workspace = true }
kiln-daemon = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[[bin]]
name = "kiln"
path = "src/main.rs"
