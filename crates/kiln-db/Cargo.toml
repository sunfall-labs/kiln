[package]
name = "kiln-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Only compiler-owned concrete types sit below the query database. The small digest primitive is
# used where equality has no full source value behind it; Oxc remains isolated in `frontend-oxc`.
# See ADRs 0006 and 0010.
[dependencies]
ahash = { workspace = true }
kiln-digest = { workspace = true }
kiln-hir = { workspace = true }
kiln-ir = { workspace = true }

# A dev-dependency compiles only for this crate's own tests, so the property-based memoization
# oracle adds nothing to downstream rebuilds (ADR 0004).
[dev-dependencies]
proptest = { workspace = true }
